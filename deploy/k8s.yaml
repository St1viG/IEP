apiVersion: v1
kind: ConfigMap
metadata:
  name: investment-fund-config
data:
  PRODUCTION: "True"

  DATABASE_USERNAME: root
  DATABASE_URL: mysql-service
  DATABASE_NAME: investment_fund
  MYSQL_DATABASE: investment_fund

  MONGO_HOST: mongo-service
  MONGO_PORT: "27017"
  MONGO_USERNAME: root
  MONGO_AUTH_SOURCE: admin
  MONGO_DATABASE: investment_fund
  MONGO_ASSETS: assets
  MONGO_INITDB_ROOT_USERNAME: root

  REDIS_HOST: redis-service
  REDIS_PORT: "6379"
  REDIS_ORDERS: orders
  REDIS_CONTRACTS: contracts

  BLOCKCHAIN_URL: http://ganache-service:8545
---
apiVersion: v1
kind: Secret
metadata:
  name: investment-fund-secret
type: Opaque
stringData:
  DATABASE_PASSWORD: root
  MYSQL_ROOT_PASSWORD: root
  MONGO_PASSWORD: example
  MONGO_INITDB_ROOT_PASSWORD: example
  # Signs the access tokens. All three services verify against it, so it has to
  # be one value shared by all of them.
  JWT_SECRET_KEY: investment-fund-signing-key
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-volume
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/local/investment-fund/mysql
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-claim
spec:
  storageClassName: ""
  volumeName: mysql-volume
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-volume
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/local/investment-fund/mongo
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-claim
spec:
  storageClassName: ""
  volumeName: mongo-volume
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  # The claim is ReadWriteOnce, so a rolling update would deadlock: the new pod
  # cannot mount the volume until the old one lets go.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql
          # No tag means Kubernetes would default to Always and insist on
          # reaching Docker Hub on every pod start. A node that already has the
          # image should not need the network to bring the system up.
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: investment-fund-config
            - secretRef:
                name: investment-fund-secret
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-claim
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          # Pinned: mongo 8 refuses to start on Linux kernel 6.19 and newer
          # (SERVER-121912), which is what a current Docker Desktop node runs.
          image: mongo:7
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: investment-fund-config
            - secretRef:
                name: investment-fund-secret
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-claim
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ganache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ganache
  template:
    metadata:
      labels:
        app: ganache
    spec:
      containers:
        - name: ganache
          image: trufflesuite/ganache-cli
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8545
---
apiVersion: v1
kind: Service
metadata:
  name: ganache-service
spec:
  # NodePort rather than ClusterIP: voters cast their ballots from outside the
  # cluster, so the simulator has to be reachable from the host the same way the
  # three web services are.
  type: NodePort
  selector:
    app: ganache
  ports:
    - protocol: TCP
      port: 8545
      targetPort: 8545
      nodePort: 30003
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migration-job
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      # MySQL takes the better part of a minute to initialise an empty data
      # directory. Without this wait the Job races it and spends its whole
      # backoffLimit on connection refusals before MySQL is ever listening.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mysql-service 3306; do echo "waiting for mysql"; sleep 2; done
      containers:
        - name: migration
          image: migration
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: investment-fund-config
            - secretRef:
                name: investment-fund-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication
  template:
    metadata:
      labels:
        app: authentication
    spec:
      containers:
        - name: authentication
          image: authentication
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: investment-fund-config
            - secretRef:
                name: investment-fund-secret
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: authentication-service
spec:
  type: NodePort
  selector:
    app: authentication
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employee
  template:
    metadata:
      labels:
        app: employee
    spec:
      containers:
        - name: employee
          image: employee
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: investment-fund-config
            - secretRef:
                name: investment-fund-secret
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: employee-service
spec:
  type: NodePort
  selector:
    app: employee
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: director
spec:
  replicas: 1
  selector:
    matchLabels:
      app: director
  template:
    metadata:
      labels:
        app: director
    spec:
      containers:
        - name: director
          image: director
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: investment-fund-config
            - secretRef:
                name: investment-fund-secret
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: director-service
spec:
  type: NodePort
  selector:
    app: director
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30002
