name: investment-fund

services:
  database:
    image: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=investment_fund
    ports:
      - 3306:3306

  adminer:
    image: adminer
    ports:
      - 8080:8080

  mongo:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    ports:
      - 27017:27017

  redis:
    image: redis
    ports:
      - 6379:6379

  ganache:
    image: trufflesuite/ganache-cli
    ports:
      - 8545:8545
