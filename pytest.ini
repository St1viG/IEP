[pytest]
pythonpath = src
testpaths = tests

# Every integration test talks to a real service. Without a cap, one that is
# reachable but not answering hangs the whole run instead of failing it, which
# is the last thing you want the night before a defense. 15s is far above the
# slowest test here (contract deployment on an emulated ganache, ~2s).
timeout = 15

markers =
    integration: needs the development.yaml services to be running
