# docs/ holds the course materials and the assignment. They are reference, not
# our code: ruff must not restyle them and the whitespace hooks must not touch
# them, or the thing we compare against stops being what the professor wrote.
exclude: ^docs/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # contracts/output/ holds solc artifacts. A trailing newline appended to Voting.bin
      # would be read straight into the deploy transaction as bytecode.
      - id: end-of-file-fixer
        exclude: ^contracts/output/
      - id: trailing-whitespace
        exclude: ^contracts/output/
      # k8s.yaml is deliberately one multi-document file, so the defense is a
      # single kubectl apply.
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      # docs/materials carries the course slides and a jdbc jar. 3 MB is above
      # those and still well below anything that belongs in git lfs.
      - id: check-added-large-files
        args: [--maxkb=3000]
