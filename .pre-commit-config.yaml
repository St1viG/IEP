repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # output/ holds solc artifacts. A trailing newline appended to Voting.bin
      # would be read straight into the deploy transaction as bytecode.
      - id: end-of-file-fixer
        exclude: ^output/
      - id: trailing-whitespace
        exclude: ^output/
      # k8s.yaml is deliberately one multi-document file, so the defense is a
      # single kubectl apply.
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
