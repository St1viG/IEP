services:
  database:
    image: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=investment_fund
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer
    ports:
      - 8080:8080

  mongo:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example

  redis:
    image: redis

  migration:
    image: migration
    build:
      context: .
      dockerfile: migration.dockerfile
    environment:
      - DATABASE_USERNAME=root
      - DATABASE_PASSWORD=root
      - DATABASE_URL=database
      - DATABASE_NAME=investment_fund
    depends_on:
      database:
        condition: service_healthy

  authentication:
    image: authentication
    build:
      context: .
      dockerfile: authentication.dockerfile
    environment:
      - PRODUCTION=True
      - DATABASE_USERNAME=root
      - DATABASE_PASSWORD=root
      - DATABASE_URL=database
      - DATABASE_NAME=investment_fund
    ports:
      - ${AUTHENTICATION_PORT:-5000}:5000
    depends_on:
      migration:
        condition: service_completed_successfully

  employee:
    image: employee
    build:
      context: .
      dockerfile: employee.dockerfile
    environment:
      - PRODUCTION=True
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_USERNAME=root
      - MONGO_PASSWORD=example
      - MONGO_AUTH_SOURCE=admin
      - MONGO_DATABASE=investment_fund
      - MONGO_ASSETS=assets
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ORDERS=orders
    ports:
      - ${EMPLOYEE_PORT:-5001}:5000
    depends_on:
      - mongo
      - redis

  director:
    image: director
    build:
      context: .
      dockerfile: director.dockerfile
    environment:
      - PRODUCTION=True
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_USERNAME=root
      - MONGO_PASSWORD=example
      - MONGO_AUTH_SOURCE=admin
      - MONGO_DATABASE=investment_fund
      - MONGO_ASSETS=assets
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ORDERS=orders
    ports:
      - ${DIRECTOR_PORT:-5002}:5000
    depends_on:
      - mongo
      - redis
