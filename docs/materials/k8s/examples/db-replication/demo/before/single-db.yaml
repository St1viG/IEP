---
# BEFORE: Single PostgreSQL instance
# All reads AND writes go to one pod — bottleneck under load
apiVersion: v1
kind: Namespace
metadata:
  name: db-before
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: db-before
type: Opaque
stringData:
  POSTGRES_PASSWORD: "demo-password-123"
---
# Headless service required by StatefulSet for stable pod DNS
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: db-before
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      name: postgres
---
# Single ClusterIP service — every read and write goes here
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: db-before
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: db-before
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: appdb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "appdb"]
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
