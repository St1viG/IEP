apiVersion: v1
kind: Pod
metadata:
  name: mysql
  labels:
    name: mysql-pod
spec:
  containers:
  - name: mysql
    image: mysql
    ports:
    - containerPort: 3306
    env:
    - name: MYSQL_ROOT_PASSWORD
      value: "password"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  type: ClusterIP
  selector:
    name: mysql-pod
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer-deployment
  labels:
    name: adminer-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      name: adminer-pod
  template:
    metadata:
      labels:
        name: adminer-pod
    spec:
      containers:
      - name: adminer
        image: adminer
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: adminer-service
spec:
  type: NodePort
  sessionAffinity: ClientIP
  selector:
    name: adminer-pod
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30000
